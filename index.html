function decodeDocument(value){return decodeURIComponent(Array.prototype.map.call(atob(value),function(c){return "%"+c.charCodeAt(0).toString(16).padStart(2,"0")}).join(""));}
const documents={hotel:decodeDocument(encodedDocuments.hotel),spa:decodeDocument(encodedDocuments.spa),airport:decodeDocument(encodedDocuments.airport)};
const names={hotel:'Hotel Desk',spa:'SPA Desk',airport:'Airport Calculator'};
const frames={hotel:document.getElementById('frame-hotel'),spa:document.getElementById('frame-spa'),airport:document.getElementById('frame-airport')};
let client=null,user=null,started=false,queue=Promise.resolve();
function showGate(show){$('auth-gate').hidden=!show;$('portal-userbar').hidden=show;}
function msg(s){$('auth-message').textContent=s||'';}
function activate(key){Object.keys(frames).forEach(k=>{const active=k===key;frames[k].hidden=!active;const b=document.querySelector('[data-app="'+k+'"]');if(b){b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));}});document.title=names[key]+' — Hotel Desk';try{history.replaceState(null,'','#'+key)}catch(e){}}
function startApps(){if(started)return;started=true;Object.keys(frames).forEach(k=>frames[k].srcdoc=documents[k]);const key=location.hash.slice(1);activate(frames[key]?key:'hotel');}
async function cloudRead(key){const {data,error}=await client.from('app_data').select('data').eq('app_key',key).maybeSingle();if(error)throw error;return data?data.data:null;}
async function cloudWrite(key,payload){let data;try{data=JSON.parse(payload)}catch(e){return}const {error}=await client.from('app_data').upsert({app_key:key,data,updated_at:new Date().toISOString()},{onConflict:'app_key'});if(error)throw error;}
async function loadCloud(){msg('Проверяем облачные данные…');for(const x of [{app:'hotel',storage:'hotelDeskFresh_v1',fallback:{tasks:[],reports:[],checklist:{},draft:{},lastPreview:''}},{app:'spa',storage:'spaDeskBookings_v1',fallback:{bookings:[]}}]){const remote=await cloudRead(x.app);let local=null;try{local=localStorage.getItem(x.storage)}catch(e){}if(remote!==null&&remote!==undefined){localStorage.setItem(x.storage,JSON.stringify(remote));}else if(local){await cloudWrite(x.app,local);}else{await cloudWrite(x.app,JSON.stringify(x.fallback));localStorage.setItem(x.storage,JSON.stringify(x.fallback));}}startApps();$('portal-user-email').textContent=user.email||'Вход выполнен';showGate(false);msg('');}
Object.keys(frames).forEach(k=>document.querySelector('[data-app="'+k+'"]').addEventListener('click',()=>activate(k)));
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='hoteldesk-cloud-save'||!user||!client||!['hotel','spa'].includes(d.appKey)||typeof d.payload!=='string')return;queue=queue.then(()=>cloudWrite(d.appKey,d.payload)).catch(err=>{console.error(err);msg('Ошибка облачного сохранения: '+(err.message||''));});});
$('auth-form').addEventListener('submit',async e=>{e.preventDefault();if(!client){msg('Модуль входа ещё загружается. Подождите несколько секунд и попробуйте снова.');return;}const b=$('auth-submit');b.disabled=true;b.textContent='Входим…';msg('');try{const {data,error}=await client.auth.signInWithPassword({email:$('auth-email').value.trim(),password:$('auth-password').value});if(error)throw error;user=data.user;await loadCloud();}catch(err){console.error(err);msg(err.message==='Invalid login credentials'?'Неверная почта или пароль.':'Не удалось подключиться: '+(err.message||'проверьте настройки Supabase'));}finally{b.disabled=false;b.textContent='Войти в портал';}});
$('auth-logout').addEventListener('click',async()=>{await client.auth.signOut();user=null;started=false;Object.keys(frames).forEach(k=>frames[k].srcdoc='');showGate(true);});
const sdk=document.createElement('script');sdk.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sdk.onload=async()=>{try{client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session){user=data.session.user;await loadCloud();}}catch(err){console.error(err);msg('Ошибка подключения к Supabase: '+(err.message||''));}};sdk.onerror=()=>msg('Не удалось загрузить модуль входа. Проверьте интернет.');document.head.appendChild(sdk);
})();
</script></body></html>
